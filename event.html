 </head>
 <body>
    <H1>Annual Tech Event 2026</H1>
    <table border="1">
    <thead>
        <tr>
            <th>Time</th>
            <th>Activity</th>
            <th>Venue</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>09:00 AM </td>
            <td>Opening ceremony</td>

        </tr>
        <tr>
            <td>11:00 AM</td>

        <tr>
            <td>02:00 PM</td>
            <TD>Guest lecture</TD>

    </tbody>
    </table>
    <h2>Event Registration Form</h2>
    <form action=" "method="post"
        onsubmit="return false;">
        <label for="Name">Full name:</label><br>
        <input type="Text" id="name" name="name"><br>
        <label for="email">Email address:</label><br>
        <input type="email" id="email" name="email"><br>
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age"><br>
        <label for="date">Event date:</label><br>
        <input type="date" id="date" name="date"><br>
        <p>Ticket type:</p>
        <input type="radio" id="Standard" name="ticket" value="standard">
        <label for="standard">standard</label><br>
        <input type="radio" id="premium" name="ticket" value="premium">
        <label for="premium">premium</label><br>
        <input type="radio" id="vip" name="ticket" value="vip">
        <label for="vip">VIP</label><br>
        <p>Work Prefrences:</p>
        <input type="checkbox" id="web" name="workshop" value="web developement">
        <label for="web">web developement</label><br>
<input type="checkbox" id="iot" name="workshop" value="internet of things">
        <label for="iot">Internet of things</label><br>
            <input type="checkbox" id="ai" name="workshop" value="artificial intelligence">
        <label for="ai">artificial intelligence</label><br>
        <label for="comments">additonal comments:</label><br>
        <textarea id="comments"  name="comments"></textarea><br>
        <button type="submit">Registor</button>



    </form>
 </body>
 </html
